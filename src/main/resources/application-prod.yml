# 生产环境配置。所有地址与凭据必须由环境变量/配置中心注入，缺失即启动失败（fail-fast）。
# 必需环境变量：MYSQL_HOST / MYSQL_DB / MYSQL_USERNAME / MYSQL_PASSWORD / REDIS_HOST
# 可选环境变量：MYSQL_PORT REDIS_PORT REDIS_PASSWORD REDIS_DB SECURITY_ADMIN_ORG_CODES SERVER_PORT
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB:region_lis}?useUnicode=true&characterEncoding=UTF-8&useSSL=${MYSQL_USE_SSL:true}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX:16}
          max-idle: 8
          min-idle: 2

logging:
  level:
    root: INFO
    com.region.lis: INFO

security:
  # 未注入则管理员端接口拒绝所有调用（fail-close）。请注入真实的管理员机构编码。
  admin-org-codes: ${SECURITY_ADMIN_ORG_CODES:}
