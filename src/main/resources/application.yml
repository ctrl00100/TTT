server:
  port: ${SERVER_PORT:8081}

spring:
  profiles:
    # 默认本地开发环境。生产启动：java -jar lis.jar --spring.profiles.active=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    name: ${LOG_FILE:logs/region-lis.log}
  level:
    com.region.lis: INFO

# 安全配置。数据源、Redis 等环境相关项在 application-{profile}.yml 中。
security:
  # 管理员机构编码（逗号分隔），用于 /auth/reset-password 的管理权限校验。
  # 基线默认留空：未显式配置即拒绝所有调用（fail-close）。由部署方通过环境变量注入。
  admin-org-codes: ${SECURITY_ADMIN_ORG_CODES:}
  # 必须配置 sys_permission 权限记录的接口。查不到权限记录时一律拒绝（fail-close）。
  fail-close-paths:
    - /auth/reset-password
